name: Check values deck

# Every card must fit ACT's definition of a value. See scripts/check-deck.mjs.
on:
  push:
    paths: ['assets/js/values.js', 'scripts/check-deck.mjs']
  pull_request:
    paths: ['assets/js/values.js', 'scripts/check-deck.mjs']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-deck.mjs
