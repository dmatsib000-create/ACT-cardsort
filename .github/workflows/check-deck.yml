name: Check values deck

# Every card must fit ACT's definition of a value. See scripts/check-deck.mjs.
on:
  push:
    paths: ['assets/js/values.js', 'scripts/check-deck.mjs', 'scripts/sync-values-map.mjs', 'docs/values-map.html', 'docs/VALUES-MAP.md']
  pull_request:
    paths: ['assets/js/values.js', 'scripts/check-deck.mjs', 'scripts/sync-values-map.mjs', 'docs/values-map.html', 'docs/VALUES-MAP.md']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-deck.mjs
      - name: The values map matches the deck
        run: node scripts/sync-values-map.mjs
